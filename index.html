<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimpleGeo — тренажёр ОГЭ по географии</title>
    <meta name="description" content="Подготовка к ОГЭ по географии: тренажёр заданий из банка ФИПИ." />

    <!-- Фавикон — знак «sg» из бренд-кита. SVG для современных браузеров,
         PNG — запасной, apple-touch-icon — для экрана «Домой» на iPhone. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/brand/logo/simplegeo-mark-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Цвет панели браузера на телефоне = бумага (--sg-paper) -->
    <meta name="theme-color" content="#F5F4EE" />

    <!-- Превью ссылки в Telegram, VK и мессенджерах. Картинка — фон og-link из
         бренд-кита + вордмарк (брендбук, раздел «Внедрение на сайт»).
         Адрес абсолютный и с www: simplegeo.ru отдаёт 301 на www. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SimpleGeo" />
    <meta property="og:title" content="SimpleGeo — тренажёр ОГЭ по географии" />
    <meta property="og:description" content="Подготовка к ОГЭ по географии: тренажёр заданий из банка ФИПИ." />
    <meta property="og:url" content="https://www.simplegeo.ru/" />
    <meta property="og:image" content="https://www.simplegeo.ru/brand/og/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
